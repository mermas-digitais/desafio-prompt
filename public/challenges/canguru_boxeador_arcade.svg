<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="arena" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B032D"/>
      <stop offset="55%" stop-color="#29095E"/>
      <stop offset="100%" stop-color="#4C0E5F"/>
    </linearGradient>
    <linearGradient id="glove" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#arena)"/>

  <!-- Placares Holográficos de Fliperama no Topo -->
  <g filter="url(#glow)">
    <rect x="110" y="70" width="340" height="110" rx="18" fill="#150734" stroke="#00E5FF" stroke-width="4"/>
    <text x="280" y="115" text-anchor="middle" fill="#FF4A97" font-family="monospace" font-weight="bold" font-size="26">HIGH SCORE</text>
    <text x="280" y="158" text-anchor="middle" fill="#FFD500" font-family="monospace" font-weight="bold" font-size="38">999,850 PTS</text>

    <rect x="574" y="70" width="340" height="110" rx="18" fill="#150734" stroke="#FF4A97" stroke-width="4"/>
    <text x="744" y="115" text-anchor="middle" fill="#00E5FF" font-family="monospace" font-weight="bold" font-size="26">ARCADE ARENA</text>
    <text x="744" y="158" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-weight="bold" font-size="36">ROUND 1 • KO</text>
  </g>

  <!-- Cordas de Laser Neon do Ringue -->
  <g stroke-width="8" filter="url(#glow)">
    <line x1="0" y1="560" x2="1024" y2="560" stroke="#FF4A97"/>
    <line x1="0" y1="680" x2="1024" y2="680" stroke="#00E5FF"/>
    <line x1="0" y1="800" x2="1024" y2="800" stroke="#FFD500"/>
  </g>

  <!-- Piso do Ringue Futurista -->
  <polygon points="80,840 944,840 1024,1024 0,1024" fill="#1E0B47" stroke="#9747FF" stroke-width="5"/>

  <!-- Canguru Atlético Boxeador com Jaqueta Brilhante -->
  <g transform="translate(0, 20)">
    <!-- Orelhas Longas de Canguru -->
    <ellipse cx="445" cy="255" rx="28" ry="88" transform="rotate(-18 445 255)" fill="#D97724" stroke="#FDBA74" stroke-width="4"/>
    <ellipse cx="579" cy="255" rx="28" ry="88" transform="rotate(18 579 255)" fill="#D97724" stroke="#FDBA74" stroke-width="4"/>

    <!-- Jaqueta Esportiva Neon Roxo & Ouro -->
    <path d="M 335 820 L 365 500 Q 512 465 659 500 L 689 820 Z" fill="#9747FF" stroke="#FFD500" stroke-width="8"/>
    <polygon points="455,500 512,670 569,500" fill="#FF4A97"/>

    <!-- Cabeça Carismática do Canguru -->
    <ellipse cx="512" cy="395" rx="96" ry="84" fill="#E0822D" stroke="#FDBA74" stroke-width="4"/>
    <ellipse cx="512" cy="430" rx="56" ry="44" fill="#FDE68A"/>
    <!-- Faixa de Campeão na Testa -->
    <rect x="418" y="335" width="188" height="26" rx="10" fill="#FF4A97" stroke="#FFD500" stroke-width="3"/>
    <!-- Olhos Determinados e Focinho -->
    <circle cx="472" cy="382" r="12" fill="#1E1B24"/><circle cx="475" cy="379" r="4" fill="#FFF"/>
    <circle cx="552" cy="382" r="12" fill="#1E1B24"/><circle cx="549" cy="379" r="4" fill="#FFF"/>
    <polygon points="494,415 530,415 512,436" fill="#1E1B24"/>

    <!-- Luvas de Boxe Energizadas por Raios Azuis -->
    <g filter="url(#glow)">
      <circle cx="285" cy="545" r="88" fill="url(#glove)" stroke="#FFFFFF" stroke-width="6"/>
      <circle cx="739" cy="515" r="96" fill="url(#glove)" stroke="#FFFFFF" stroke-width="6"/>
      <!-- Raios Elétricos Azuis e Dourados -->
      <polyline points="200,450 250,500 220,530 280,590" fill="none" stroke="#00FFFF" stroke-width="7" stroke-linecap="round"/>
      <polyline points="835,410 770,465 805,495 735,565" fill="none" stroke="#00FFFF" stroke-width="7" stroke-linecap="round"/>
      <polyline points="680,415 725,460 700,490 755,535" fill="none" stroke="#FFD500" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
